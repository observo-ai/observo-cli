# Triggered on `v*` tag push. GoReleaser does:
#   - cross-platform binaries → GitHub Release
#   - brew formula → observo-ai/homebrew-tap
#   - multi-arch Docker → ghcr.io/observo-ai/observo-cli
# Then a follow-up `npm-publish` job pushes the wrapper to @observo-ai/cli.
#
# Required secrets:
#   - HOMEBREW_TAP_GITHUB_TOKEN: PAT (classic) with `repo` scope, used to
#     push the formula commit to the homebrew-tap repo. GITHUB_TOKEN
#     cannot cross repo boundaries.
#   - NPM_TOKEN: npm "automation" token from npmjs.com → @observo-ai org.
# GITHUB_TOKEN (auto) is used for the GitHub Release + GHCR push.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create release, upload assets
  packages: write   # push to GHCR
  id-token: write   # OIDC (future use: cosign / npm provenance)

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser needs full git history to compute the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch Docker)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Derive the release version from the tag (strip the leading `v`)
      # and pin the package.json `version` field to it before publish.
      # npm version field must match the tag for our post-install script
      # to download the right binary set from GitHub Releases.
      - name: Set package version from tag
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing @observo-ai/cli@$VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
